# Options
set -sg terminal-overrides ",*:RGB"  # true color support
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window

# Options: start indexes from 1
set -g base-index 1
set -g pane-base-index 1

# Change prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

#Status
set -g status-position top
set -g status-left-length 100

# Use terminal background/foreground
set -g status-style "fg=default,bg=default"
set -g status-left "#W"
set -g status-right ""

# Style
# Theme: borders
set -g pane-border-style fg="#333333",bright
set -g pane-active-border-style fg="#777777"

# Windows
set -g window-status-current-format "#[underscore]#I"
set -g window-status-format "#[fg=#777777]#I"
set -g status-justify right

# Messages
set -g message-style "fg=default,bg=default"

# Copy mode
set -g mode-style "fg=black,bg=cyan"
