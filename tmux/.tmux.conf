# Style
set -g status-position top
set -g status-left-length 100

# Use terminal background/foreground
set -g status-style "fg=default,bg=default"

# Session name
set -g status-left "#[fg=green,bold] #S #[fg=default,nobold]| "

set -g status-right " "

# Windows
set -g window-status-current-format "#[fg=cyan,bold] #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format "#[fg=colour8] #I:#W"

# Messages
set -g message-style "fg=default,bg=default"

# Copy mode
set -g mode-style "fg=black,bg=cyan"

# Borders
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=green"